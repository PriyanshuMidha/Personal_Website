name: Keep Server Alive

on:
  schedule:
    # Runs on the 1st and 27th of every month (max gap 26 days),
    # since GitHub Actions cron cannot express "every N days" across month boundaries.
    - cron: "0 6 1,27 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 "${{ secrets.RENDER_SERVER_URL }}/api/health"
